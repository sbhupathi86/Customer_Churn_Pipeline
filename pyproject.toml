[project]
name = "customer-churn-pipeline"
version = "0.1.0"
description = "Code that does the customer churn completely"
readme = "README.md"
authors = [
    { name = "Srihari Bhupathiraju", email = "bhupathiraju.srihari@heb.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyspark>=4.2.1",
]

[project.scripts]
customer-churn-pipeline = "customer_churn_pipeline:main"
customer-churn = "customer_churn_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]


